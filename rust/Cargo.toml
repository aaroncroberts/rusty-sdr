[workspace]
resolver = "2"
members = [
    "crates/sdrapp-core",
    "crates/sdrapp-sdrplay-sys",
    "crates/sdrapp-sdrplay",
    "crates/sdrapp-audio",
    "crates/sdrapp-recorder",
    "crates/sdrapp-midi",
    "crates/sdrapp-rtlsdr",
    "crates/sdrapp-ui",
    "crates/sdrapp-adsb",
    ".",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aaron C. Roberts"]
license = "GPL-3.0"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }

# DSP
num-complex = "0.4"
dasp = { version = "0.11", features = ["signal"] }

# Audio
cpal = "0.15"

# MIDI
midir = "0.10"

# UI
egui = "0.29"
eframe = { version = "0.29", features = ["wgpu"] }
egui_plot = "0.29"

# WAV I/O
hound = "3"

# Platform dirs
dirs = "5"

# FFT
rustfft = "6"

# Synchronization
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# Testing
proptest = "1"
approx = "0.5"

[package]
name = "sdrapp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sdrapp"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
sdrapp-core = { path = "crates/sdrapp-core" }
sdrapp-sdrplay = { path = "crates/sdrapp-sdrplay" }
sdrapp-audio = { path = "crates/sdrapp-audio" }
sdrapp-recorder = { path = "crates/sdrapp-recorder" }
sdrapp-midi = { path = "crates/sdrapp-midi" }
sdrapp-rtlsdr = { path = "crates/sdrapp-rtlsdr" }
sdrapp-ui = { path = "crates/sdrapp-ui" }

[dev-dependencies]
hound = { workspace = true }
tokio = { workspace = true }

# ── Dev-profile optimizations ─────────────────────────────────────────────────
# DSP and audio crates are compute-bound — running them at opt-level 2 in debug
# builds eliminates the IQ-channel lag that causes choppy audio and dropped
# batches.  The UI/app crates stay unoptimized so incremental builds stay fast.
[profile.dev.package.sdrapp-core]
opt-level = 2

[profile.dev.package.sdrapp-sdrplay]
opt-level = 2

[profile.dev.package.sdrapp-audio]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.num-complex]
opt-level = 3
